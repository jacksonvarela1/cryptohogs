<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crypto Hogs speaker card generator</title>
<meta name="robots" content="noindex">
<style>
  @font-face{font-family:'Space Grotesk Fallback';src:local('Arial');size-adjust:126.64%;ascent-override:77.70%;descent-override:23.06%;line-gap-override:0%}
  @font-face{font-family:'Instrument Serif Fallback';src:local('Georgia');font-style:italic;size-adjust:98.88%;ascent-override:100.12%;descent-override:31.35%;line-gap-override:0%}
  @font-face{font-family:'IBM Plex Mono Fallback';src:local('Consolas');size-adjust:109.13%;ascent-override:93.92%;descent-override:25.20%;line-gap-override:0%}
  :root{
    --ink:#0B0B0D; --panel:#141417; --cream:#F4EFE4;
    --cream-dim:rgba(244,239,228,.56); --line:rgba(244,239,228,.12);
    --cardinal:#9D2235; --cardinal-hot:#C41230; --bronze:#C9A96A; --bronze-deep:#8F7340;
    --font-d:'Space Grotesk','Space Grotesk Fallback',ui-sans-serif,system-ui,sans-serif;
    --font-s:'Instrument Serif','Instrument Serif Fallback',Georgia,serif;
    --font-m:'IBM Plex Mono','IBM Plex Mono Fallback',ui-monospace,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  body{font-family:var(--font-d);-webkit-font-smoothing:antialiased}

  .card{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:
      radial-gradient(120% 70% at 78% 8%, rgba(157,34,53,.30) 0%, rgba(157,34,53,0) 62%),
      radial-gradient(90% 55% at 10% 100%, rgba(201,169,106,.13) 0%, rgba(201,169,106,0) 60%),
      var(--ink);
    color:var(--cream);
    display:flex;flex-direction:column;
    padding:88px 84px 76px;
  }
  .card::after{
    content:"";position:absolute;inset:26px;border:1px solid var(--line);
    pointer-events:none;
  }
  .coin{
    position:absolute;width:720px;height:720px;right:-186px;top:566px;
    opacity:.10;filter:grayscale(.3) contrast(1.05);
  }

  .top{display:flex;align-items:center;gap:18px;position:relative;z-index:2}
  .top img{width:44px;height:44px;display:block}
  .mono{font-family:var(--font-m);letter-spacing:.16em;text-transform:uppercase;font-size:19px;font-weight:500}
  .top .mono{color:var(--bronze)}
  .top .rule{height:1px;flex:1;background:var(--bronze-deep);opacity:.5}

  .datebar{
    position:relative;z-index:2;margin-top:74px;
    display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;
  }
  .day{
    font-family:var(--font-m);font-size:26px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--cream);background:var(--cardinal);padding:14px 22px 12px;
  }
  .time{font-family:var(--font-m);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim)}

  h1{
    position:relative;z-index:2;margin-top:46px;
    font-size:104px;line-height:.95;letter-spacing:-.045em;font-weight:700;
    max-width:16ch;
  }
  h1 em{font-family:var(--font-s);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--bronze)}

  .who{
    position:relative;z-index:2;margin-top:40px;
    font-size:38px;line-height:1.25;letter-spacing:-.02em;color:var(--cream);
    max-width:22ch;
  }
  .who span{display:block;font-size:29px;color:var(--cream-dim);margin-top:12px;letter-spacing:-.01em;max-width:19ch}

  .spacer{flex:1}

  .chips{position:relative;z-index:2;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
  .chip{
    font-family:var(--font-m);font-size:21px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(244,239,228,.24);padding:13px 20px 11px;color:var(--cream);
  }
  .chip.hot{border-color:var(--cardinal-hot);color:#F4C9CF;background:rgba(196,18,48,.16)}

  .free{
    position:relative;z-index:2;
    border-top:1px solid var(--line);padding-top:34px;
    font-size:33px;line-height:1.34;letter-spacing:-.02em;color:var(--cream);
  }
  .free b{font-weight:700;color:var(--bronze)}

  .foot{
    position:relative;z-index:2;margin-top:30px;display:flex;
    justify-content:space-between;align-items:flex-end;gap:24px;
  }
  .foot .site{font-family:var(--font-m);font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim)}
  .foot .rso{font-family:var(--font-m);font-size:15px;line-height:1.5;letter-spacing:.03em;color:rgba(244,239,228,.34);text-align:right;max-width:36ch}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="coin" src="../coin.png" alt="">
  <div class="top">
    <img src="../coin-96.png" alt="">
    <div class="mono">Crypto Hogs</div>
    <div class="rule"></div>
    <div class="mono" id="kicker">Speaker night</div>
  </div>

  <div class="datebar">
    <div class="day" id="day">TUE SEP 22</div>
    <div class="time">5:30 to 7:00 PM CT</div>
  </div>

  <h1 id="title"></h1>

  <div class="who" id="who"></div>

  <div class="spacer"></div>

  <div class="chips" id="chips"></div>

  <div class="free">
    <b>Free and open to all University of Arkansas students.</b>
    No experience or crypto ownership required.
  </div>

  <div class="foot">
    <div class="site">jacksonvarela1.github.io/cryptohogs</div>
    <div class="rso">Registered student organization. Not an official unit of the University of Arkansas.</div>
  </div>
</div>

<script>
/* One entry per confirmed speaker night. To add a night, copy a block, change the
   five fields, then render it: see assets/social/README.md for the one command. */
var EVENTS = {
  "2026-09-22": {
    day:   "TUE SEP 22",
    title: "Onchain <em>letters of credit</em>",
    who:   "Max, CEO of ANVL Research Labs",
    note:  "Trade finance from scratch, then a live demo and open Q&A",
    where: "Virtual"
  },
  "2026-10-06": {
    day:   "TUE OCT 6",
    title: "Bitcoin mining, <em>up close</em>",
    who:   "Ben Smith of Bear Market Mining, Walnut Ridge AR",
    note:  "A facility walkthrough and the economics of when mining actually pays",
    where: "In person"
  },
  "2026-10-13": {
    day:   "TUE OCT 13",
    title: "From Fayetteville <em>to Wall Street</em>",
    who:   "Nick Carpinito of Blockworks Research, a UARK alum",
    note:  "Walking a real research report, then a fireside on breaking in",
    where: "Virtual"
  }
};

var key = new URLSearchParams(location.search).get("e") || "2026-09-22";
var e = EVENTS[key];
if (e) {
  document.getElementById("day").textContent = e.day;
  document.getElementById("title").innerHTML = e.title;
  document.getElementById("who").innerHTML =
    e.who + '<span>' + e.note + '</span>';
  document.getElementById("chips").innerHTML =
    '<div class="chip hot">' + e.where + '</div>' +
    '<div class="chip">Speaker night</div>' +
    '<div class="chip">Dues $0</div>';
  document.title = "Crypto Hogs " + key;
}
</script>
</body>
</html>
